<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Interativo com Alternativas</title>

  <style>
    /* Estilos principais iguais aos anteriores */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100%;
      background: #121212;
      color: #e0e0e0;
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-wrapper {
      background: #1e1e1e;
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 0 20px #6200ea88;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 360px;
    }

    .question-number {
      font-weight: 700;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 0.3rem;
    }

    h1.question {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: #bb86fc;
      margin-bottom: 1rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      background: #222;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .option:hover {
      background-color: #333;
    }

    .option.selected {
      border-color: #bb86fc;
      background-color: #333;
    }

    .option.correct {
      border-color: #03dac6;
      background-color: #004d40;
    }

    .option.incorrect {
      border-color: #cf6679;
      background-color: #4a0000;
    }

    .feedback {
      margin-top: 0.8rem;
      min-height: 24px;
      font-weight: bold;
    }

    .feedback.correct {
      color: #03dac6;
    }

    .feedback.incorrect {
      color: #cf6679;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background: #6200ea;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 14px #6200ea88;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    button:disabled {
      background-color: #444;
      cursor: not-allowed;
      box-shadow: none;
    }

    button:hover:not(:disabled) {
      background-color: #3700b3;
    }
  </style>
</head>

<body>

  <section class="quiz-wrapper" id="quiz">
    <div class="question-number" id="questionNumber">Pergunta 1 / 5</div>
    <h1 class="question" id="questionText">Carregando...</h1>

    <div class="options" id="optionsContainer"></div>

    <div class="feedback" id="feedback"></div>

    <button id="actionButton" disabled>Confirmar</button>
  </section>

  <script>
    const questions = [
      {
        question: "Qual é a capital do Brasil?",
        options: {
          a: "São Paulo",
          b: "Rio de Janeiro",
          c: "Brasília",
          d: "Salvador"
        },
        correct: "c"
      },
      {
        question: "Quem escreveu 'Dom Casmurro'?",
        options: {
          a: "Machado de Assis",
          b: "José de Alencar",
          c: "Clarice Lispector",
          d: "Monteiro Lobato"
        },
        correct: "a"
      },
      {
        question: "Quanto é 7 x 8?",
        options: {
          a: "54",
          b: "56",
          c: "64",
          d: "58"
        },
        correct: "b"
      },
      {
        question: "Qual o maior planeta do sistema solar?",
        options: {
          a: "Terra",
          b: "Saturno",
          c: "Júpiter",
          d: "Marte"
        },
        correct: "c"
      },
      {
        question: "Quem pintou a Mona Lisa?",
        options: {
          a: "Michelangelo",
          b: "Leonardo da Vinci",
          c: "Pablo Picasso",
          d: "Vincent Van Gogh"
        },
        correct: "b"
      }
    ];

    let currentQuestion = 0;
    let selectedOption = '';
    const questionNumberEl = document.getElementById('questionNumber');
    const questionTextEl = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackEl = document.getElementById('feedback');
    const actionButton = document.getElementById('actionButton');

    function loadQuestion() {
      const q = questions[currentQuestion];
      questionNumberEl.textContent = `Pergunta ${currentQuestion + 1} / ${questions.length}`;
      questionTextEl.textContent = q.question;

      optionsContainer.innerHTML = '';
      feedbackEl.textContent = '';
      actionButton.disabled = true;
      selectedOption = '';

      for (const key in q.options) {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option';
        optionDiv.dataset.option = key;
        optionDiv.textContent = `${key.toUpperCase()}: ${q.options[key]}`;

        optionDiv.addEventListener('click', () => {
          document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
          optionDiv.classList.add('selected');
          selectedOption = key;
          actionButton.disabled = false;
        });

        optionsContainer.appendChild(optionDiv);
      }
    }

    function checkAnswer() {
      const q = questions[currentQuestion];

      const correctOption = q.correct;
      const allOptions = document.querySelectorAll('.option');

      allOptions.forEach(opt => {
        if (opt.dataset.option === correctOption) {
          opt.classList.add('correct');
        } else if (opt.dataset.option === selectedOption) {
          opt.classList.add('incorrect');
        }
        opt.classList.remove('selected');
      });

      if (selectedOption === correctOption) {
        feedbackEl.textContent = '✔️ Resposta correta!';
        feedbackEl.className = 'feedback correct';
      } else {
        feedbackEl.textContent = `❌ Errado! Resposta correta: ${correctOption.toUpperCase()}`;
        feedbackEl.className = 'feedback incorrect';
      }

      actionButton.textContent = currentQuestion < questions.length - 1 ? 'Próxima' : 'Finalizar';
      actionButton.onclick = nextQuestion;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
        actionButton.textContent = 'Confirmar';
        actionButton.onclick = checkAnswer;
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz').innerHTML = `
        <div class="result">
          <h2>Quiz Finalizado!</h2>
          <p>Você concluiu ${questions.length} perguntas.</p>
          <button onclick="restartQuiz()">Reiniciar</button>
        </div>
      `;
    }

    function restartQuiz() {
      currentQuestion = 0;
      document.getElementById('quiz').innerHTML = `
        <div class="question-number" id="questionNumber"></div>
        <h1 class="question" id="questionText">Carregando...</h1>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <button id="actionButton" disabled>Confirmar</button>
      `;
      // Referenciar novamente os elementos
      questionNumberEl = document.getElementById('questionNumber');
      questionTextEl = document.getElementById('questionText');
      optionsContainer = document.getElementById('optionsContainer');
      feedbackEl = document.getElementById('feedback');
      actionButton = document.getElementById('actionButton');

      loadQuestion();
      actionButton.onclick = checkAnswer;
    }

    // Inicializar
    loadQuestion();
    actionButton.onclick = checkAnswer;
  </script>
</body>

</html>
