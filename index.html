<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz SEBO</title>
    <style>
        /* ======== ESTILOS GERAIS ======== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a78a49, #2b2d44);
            background-image: url('fundo-biblioteca.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app {
            background-color: #fcf9f910;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(29, 28, 28, 0.25);
            backdrop-filter: blur(10px);
            color: #ffffff;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* ======== SELEÇÃO DE LIVROS ======== */

        .book-selection {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .book-btn {
            background-color: #fff;
            color: #1d1b1b;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .book-btn:hover {
            background-color: #262b29;
            color: #fff;
        }

        /* ======== CONTEÚDO DO QUIZ ======== */

        .quiz-container {
            background-color: #c99a9a20;
            border-radius: 15px;
            padding: 20px;
        }

        .quiz-title {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .question-count {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 15px;
        }

        .quiz-question p {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option {
            background-color: #0704042a;
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        .option:hover {
            background-color: #71722a;
            color: #fff;
        }

        .next-button,
        .restart-button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #ad8650;
            color: white;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .generate-cupon-button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #ad8650;
            color: white;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .next-button:hover,
        .restart-button:hover {
            background-color: #3da324;
        }

        .generate-cupon-button:hover {
            background-color: #3da324;
        }

        .hidden {
            display: none;
        }

        .correct {
            background-color: #4CAF50 !important;
            color: white;
        }

        .incorrect {
            background-color: #F44336 !important;
            color: white;
        }

        .result {
            font-size: 1.2rem;
            text-align: center;
            margin-top: 20px;
        }

        /* ======= TELA INICIAL ANTES DO QUIZ ======= */

        .start-container {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        .start-button {
            background-color: #c29148;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-button:hover {
            background-color: #3da324;
        }

        /* ======= Estilo do cumpom ======= */
        .cupon-text {
            font-size: 28px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Quiz SEBO</h1>
        <div class="start-container" id="startContainer">
            <h2>Bem-vindo ao Quiz do SEBO!</h2>
            <br></br>
            <p>Responda o QUIZ para ganhar um cupom especial de descontos!</p>
            <br></br>
            <button class="start-button" id="startButton">Iniciar Quiz</button>
        </div>
        <!-- CONTAINER DO QUIZ -->
        <div class="quiz-container hidden" id="quizContainer">
            <div class="quiz-header">
                <h2 class="quiz-title" id="quizTitle"></h2>
                <p class="question-count" id="questionCount"></p>
            </div>
            <div class="quiz-question">
                <p id="questionText">Carregando pergunta...</p>
            </div>
            <div class="cupon-text hidden" id=txtCupom></div>

            <div class="quiz-options" id="optionsContainer"></div>
            <button class="next-button" id="nextButton" disabled>Próxima Pergunta</button>
            <div class="result" id="result"></div>
            <button class="restart-button hidden" id="restartButton">Reiniciar Quiz</button>

        </div>
    </div>
    <script src="src/questões.js">
    </script>
    <script src="src/backEnd.js">
    </script>
    <script src="testes/baseTest.js">
    </script>
    <script src="testes/unitTests.js">
    </script>
    <script src="testes/componentTests.js">
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('startButton');
            const startContainer = document.getElementById('startContainer');
            const quizContainer = document.getElementById('quizContainer');
            document.body.style.backgroundImage = "url('fundo-biblioteca.jpg')";

            startButton.addEventListener('click', () => {
                startContainer.classList.add('hidden')
                quizContainer.classList.remove('hidden')

                if (typeof startQuiz === "function") {
                    startQuiz()
                }
            });
        })
    </script>
</body>

</html>
