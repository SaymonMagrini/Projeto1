<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz SEBO</title>
    <style>
        /* ======== ESTILOS GERAIS ======== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #3a8fd4, #2a2e72);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app {
            background-color: #ffffff10;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        /* ======== SELEÇÃO DE LIVROS ======== */
        
        .book-selection {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .book-btn {
            background-color: #fff;
            color: #333;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }
        
        .book-btn:hover {
            background-color: #2a2e72;
            color: #fff;
        }
        /* ======== CONTEÚDO DO QUIZ ======== */
        
        .quiz-container {
            background-color: #ffffff20;
            border-radius: 15px;
            padding: 20px;
        }
        
        .quiz-title {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .question-count {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 15px;
        }
        
        .quiz-question p {
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option {
            background-color: #fff;
            color: #333;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .option:hover {
            background-color: #2a2e72;
            color: #fff;
        }
        
        .next-button,
        .restart-button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #3a8fd4;
            color: white;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        .generate-cupon-button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #3a8fd4;
            color: white;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .next-button:hover,
        .restart-button:hover {
            background-color: #2469a3;
        }
        .generate-cupon-button:hover {
            background-color: #2469a3;
        }
        .hidden {
            display: none;
        }
        
        .correct {
            background-color: #4CAF50 !important;
            color: white;
        }
        
        .incorrect {
            background-color: #F44336 !important;
            color: white;
        }
        
        .result {
            font-size: 1.2rem;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Quiz SEBO</h1>
        <!-- CONTAINER DO QUIZ -->
        <div class="quiz-container hidden" id="quizContainer">
            <div class="quiz-header">
                <h2 class="quiz-title" id="quizTitle"></h2>
                <p class="question-count" id="questionCount"></p>
            </div>
            <div class="quiz-question">
                <p id="questionText">Carregando pergunta...</p>
            </div>
            <div class="quiz-options" id="optionsContainer"></div>
            <button class="next-button" id="nextButton" disabled>Próxima Pergunta</button>
            <div class="result" id="result"></div>
            <button class="generate-cupon-button hidden" id="cuponButton">Gerar seu cupom</button>
            <div class="cupon-text hidden" id=txtCupom></div> 
            <button class="restart-button hidden" id="restartButton">Reiniciar Quiz</button>

        </div>
    </div>
    <script src="src/backEnd.js">
    </script>
    <script src="testes/baseTest.js">
    </script>
    <script src="testes/unitTests.js">
    </script>
    <script src="testes/componentTests.js">
    </script>
</body>

</html>
